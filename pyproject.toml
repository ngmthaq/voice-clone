[project]
name = "voice-clone"
version = "0.1.0"
description = "Real-time voice cloning TUI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "textual",
    "numpy",
    "sounddevice>=0.5,<0.6",  # rescan_devices() uses its private _terminate/_initialize
    "soxr",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "transformers<5",
    "huggingface_hub",
    "faiss-cpu",
    "librosa",
    "scipy",
    "pydantic>=2",
    "platformdirs",
    "tomli",
    "tomli-w",
    "soundfile>=0.14.0",
    "pip-system-certs>=5,<6",
]

[project.scripts]
voice-clone = "voice_clone.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_clone"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/voice_clone/domain/engine/vendor", "training"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: needs real audio devices"]
