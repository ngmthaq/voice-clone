[project]
name = "voice-clone"
version = "0.1.0"
description = "Real-time voice cloning TUI"
requires-python = ">=3.10,<3.13"
dependencies = [
    "textual",
    "numpy",
    "sounddevice",
    "soxr",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "transformers<5",
    "huggingface_hub",
    "faiss-cpu",
    "librosa",
    "scipy",
    "pydantic>=2",
    "platformdirs",
    "tomli",
    "tomli-w",
    "soundfile>=0.14.0",
]

[project.scripts]
voice-clone = "voice_clone.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_clone"]

[tool.uv.sources]
torch = { index = "pytorch-cu124", marker = "sys_platform == 'win32'" }
torchaudio = { index = "pytorch-cu124", marker = "sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["src/voice_clone/engine/vendor", "training"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: needs real audio devices"]
